    <script>

        const bags = [

            "./images/bag1.png",
            "./images/bag2.png",
            "./images/bag3.png",
            "./images/bag4.png"

        ];


        let currentBag = 0;


        function nextBag() {

            currentBag++;


            if (currentBag >= bags.length) {

                currentBag = 0;

            }


            const image =
                document.getElementById("bag-image");


            image.src =
                bags[currentBag];

        }

    </script>

    
<script>

    const fly = document.querySelector(".header-fly");

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;


    fly.addEventListener("mousedown", function (event) {

        dragging = true;

        const rect = fly.getBoundingClientRect();

        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        fly.style.cursor = "grabbing";

        event.preventDefault();

    });


    document.addEventListener("mousemove", function (event) {

        if (!dragging) return;

        fly.style.left =
            (event.clientX - offsetX) + "px";

        fly.style.top =
            (event.clientY - offsetY) + "px";

    });


    document.addEventListener("mouseup", function () {

        if (!dragging) return;

        dragging = false;

        fly.style.cursor = "grab";

    });

</script>
