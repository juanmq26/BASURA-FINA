<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="css/flying-object.css">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BASURAFINA®</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<div class="flying-object"></div>

<script src="js/flying-object.js"></script>

    
<body>


    <!-- CABECERA -->

    <header class="top-bar">

        <a href="#" class="logo">

            <span>
                BASURAFINA<sup>®</sup>
            </span>

            <span class="logo-doodle">
                ⌁
            </span>

        </a>


        <nav class="top-navigation">

            <a href="#">Contact</a>

            <a href="#">Hey!</a>

            <a href="#">Join Us</a>

            <a href="#" class="subscribe">
                Subscribe →
            </a>

        </nav>

    </header>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="home">


        <!-- BOLSA -->

        <div
            class="central-image"
            id="bag-container"
            onclick="nextBag()"
        >

            <img
                id="bag-image"
                src="./images/bag1.png"
                alt="Basurafina bag"
            >

        </div>


        <!-- MANIFIESTO -->

        <section class="manifesto">

            <h1>

                Clothes are a

                <span class="blue-highlight">

                    <a href="#">
                        basura
                    </a>

                    <span class="asterisk">
                        *
                    </span>

                </span>;

                <em>
                    can you read?
                </em>

                <br>

                <span class="green-highlight">
                    “No”
                </span>

                is OK. It’s rhetorical;

                <br>

                everybody speaks

                <em>
                    clothes — everybody.
                </em>

            </h1>

        </section>


        <!-- CATEGORÍAS -->

        <nav class="categories">

            <a href="#" class="active">all</a>

            <a href="#">people</a>

            <a href="#">animals</a>

            <a href="#">objects</a>

            <a href="#">vehicles</a>

            <a href="#">food</a>

            <a href="#">plants</a>

            <a href="#">architecture</a>

        </nav>


    </main>


    <!-- CAMBIO DE BOLSAS -->

    <script>

        const bags = [

            "./images/bag1.png",
            "./images/bag2.png",
            "./images/bag3.png",
            "./images/bag4.png"

        ];


        let currentBag = 0;


        function nextBag() {

            currentBag++;


            if (currentBag >= bags.length) {

                currentBag = 0;

            }


            const image =
                document.getElementById("bag-image");


            image.src =
                bags[currentBag];

        }

    </script>


</body>

</html>
